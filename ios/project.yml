# Generate the Xcode project on a Mac: `brew install xcodegen && cd ios && xcodegen`
name: Filmoteka
options:
  bundleIdPrefix: cz.polanek
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Filmoteka:
    type: application
    platform: iOS
    sources:
      - path: Filmoteka
        excludes:
          - "*.example"
    dependencies:
      - package: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Filmoteka
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
